# Dicionário de skills (versionado). Cada skill tem:
#   nome:       como aparece nos relatórios
#   categoria:  agrupamento para as análises
#   sinonimos:  textos procurados (sem diferença de maiúsculas). A busca exige que o
#               termo não esteja colado a outra letra ou número: "SQL" não casa com "MySQLi".
#   regex:      (opcional) expressões regulares próprias, para termos ambíguos.
#   maiusculas: (opcional) true = a busca diferencia maiúsculas (para "R" e "Go").
# Alterou o dicionário? Suba a versão e rode os testes (tests/test_skills.py).
versao: 2

skills:
  # Linguagens e consulta
  - {nome: SQL, categoria: linguagem, sinonimos: [SQL, T-SQL, TSQL, PL/SQL, PLSQL, Spark SQL, SparkSQL]}
  - {nome: Python, categoria: linguagem, sinonimos: [Python, Python3, Pandas, PySpark, NumPy]}
  - nome: R
    categoria: linguagem
    maiusculas: true
    regex:
      - '(?:[Ll]inguagem|[Ll]anguage)\s+R(?![\w+#])'
      - '(?<![\w+#.])R\s*(?:/|,|\be\b|\bou\b|\band\b|\bor\b)\s*(?:[Pp]ython|SAS|SQL|Stata)'
      - '(?:[Pp]ython|SAS|SQL|Stata)\s*(?:/|,|\be\b|\bou\b|\band\b|\bor\b)\s*R(?![\w+#\-])'
      - '\bR\s?Studio\b'
      - '\bRStudio\b'
  - {nome: Java, categoria: linguagem, sinonimos: [Java]}
  - {nome: JavaScript, categoria: linguagem, sinonimos: [JavaScript, JS, ECMAScript]}
  - {nome: TypeScript, categoria: linguagem, sinonimos: [TypeScript]}
  - {nome: C#, categoria: linguagem, sinonimos: [C#, CSharp]}
  - nome: Go
    categoria: linguagem
    maiusculas: true
    regex:
      - '\b[Gg]olang\b'
      - '(?:[Ll]inguagem|[Ll]anguage)\s+Go\b'
      - '(?<![\w+#.])Go\s*(?:/|,|\be\b|\bou\b|\band\b|\bor\b)\s*(?:[Pp]ython|Java|Rust|Kotlin|Node|C\+\+|Ruby|Scala)'
      - '(?:[Pp]ython|Java|Rust|Kotlin|Node(?:\.js)?|C\+\+|Ruby|Scala)\s*(?:/|,|\be\b|\bou\b|\band\b|\bor\b)\s*Go\b(?!\s+(?:to|live|beyond|ahead|deep)\b)'
  - {nome: Scala, categoria: linguagem, sinonimos: [Scala]}
  - {nome: Kotlin, categoria: linguagem, sinonimos: [Kotlin]}
  - {nome: Ruby, categoria: linguagem, sinonimos: [Ruby, Ruby on Rails]}
  - {nome: PHP, categoria: linguagem, sinonimos: [PHP, Laravel]}
  - {nome: VBA, categoria: linguagem, sinonimos: [VBA, Excel VBA, Macros VBA, Macro VBA, Macros do Excel, Excel macros]}
  - {nome: DAX, categoria: linguagem, sinonimos: [DAX]}
  - {nome: M (Power Query), categoria: linguagem, sinonimos: [Power Query, PowerQuery, Linguagem M]}

